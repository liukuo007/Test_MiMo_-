[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mimo-ai-evaluator"
version = "0.1.0"
description = "MiMo AI 评测服务"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pydantic>=2.5.0",
    "structlog>=23.2.0",
    "httpx>=0.26.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16.0"]
torch = ["torch>=2.1.0"]
full = ["onnxruntime>=1.16.0", "torch>=2.1.0"]
