[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-backend"
version = "0.1.0"
description = "MiMo - 智能货柜全链路测试平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "aiokafka>=0.10.0",
    "paho-mqtt>=1.6.1",
    "elasticsearch[async]>=8.11.0",
    "clickhouse-connect>=0.6.0",
    "structlog>=23.2.0",
    "python-dateutil>=2.8.2",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
web = [
    "playwright>=1.40.0",
]
app = [
    "Appium-Python-Client>=3.1.0",
]
full = [
    "playwright>=1.40.0",
    "Appium-Python-Client>=3.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",   # line too long — enforce later with formatter
    "E712",   # true/false comparison — cosmetic
    "UP017",  # datetime-timezone-utc — breaks Python 3.9
    "UP042",  # replace str enum — style preference
    "UP045",  # non-pep604 annotation — breaks SQLAlchemy on Python 3.9
    "F841",   # unused variable — review later
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
