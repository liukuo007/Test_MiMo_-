apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimo-backend
  namespace: mimo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mimo-backend
  template:
    metadata:
      labels:
        app: mimo-backend
    spec:
      containers:
        - name: backend
          image: mimo/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mimo-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mimo-backend
  namespace: mimo
spec:
  selector:
    app: mimo-backend
  ports:
    - port: 8000
      targetPort: 8000
