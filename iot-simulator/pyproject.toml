[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mimo-iot-simulator"
version = "0.1.0"
description = "MiMo IoT 仿真服务"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6.1",
    "asyncio-mqtt>=0.16.0",
    "pydantic>=2.5.0",
    "structlog>=23.2.0",
    "httpx>=0.26.0",
]
